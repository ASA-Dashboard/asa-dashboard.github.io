<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASA Dashboard</title>
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ASA Dashboard">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  html,body{margin:0;height:100%;background:#0d0d0d;overflow:hidden}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#cfd3d0;font:15px Inter,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}
  #splash img{width:96px;height:96px;border-radius:22px}
  #splash a{color:#84d01f}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent}
</style>
</head>
<body>
<div id="splash"><img src="icon-192.png" alt="ASA"><div>Opening ASA Dashboard…</div><div id="slow" style="display:none;font-size:13px">Taking a while? <a href="https://script.google.com/macros/s/AKfycbwtq90UzoSJr4byU9oDp1ycTWARpmp_YZY3TERmmWr0XsC-wRCJlQMshRg7bFD1REqUEQ/exec">Open it directly</a></div></div>
<iframe id="app" credentialless src="https://script.google.com/macros/s/AKfycbwtq90UzoSJr4byU9oDp1ycTWARpmp_YZY3TERmmWr0XsC-wRCJlQMshRg7bFD1REqUEQ/exec" allow="clipboard-write; microphone; camera" title="ASA Dashboard"></iframe>
<script>
  setTimeout(function(){ document.getElementById('slow').style.display='block'; }, 12000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
